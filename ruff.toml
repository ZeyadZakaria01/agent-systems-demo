target-version = "py312"
line-length = 120
extend-exclude = ["MemState", "MemState-patched", "MemTX", ".claude", ".agents", ".runtime", "runs"]

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",  # the formatter owns line length; long string literals stay whole
    "B905",  # zip() over equal-length sequences built together
]

[lint.isort]
known-first-party = ["demo", "tests"]
